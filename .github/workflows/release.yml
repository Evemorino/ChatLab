name: Build and Release

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.1.0)'
        required: true
        type: string
  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi

          VERSION_TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ -(beta|alpha|rc)(\.|$) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$VERSION" =~ -beta(\.|$) ]]; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -alpha(\.|$) ]]; then
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -rc(\.|$) ]]; then
            echo "npm_tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

          echo "Release version: $VERSION_TAG"

  # macOS Desktop 仅发布 Apple Silicon 版本。onnxruntime-node 1.24+ 已停止提供
  # macOS x64 预编译二进制，继续生成 Intel 包会得到无法加载本地 embedding 的损坏产物。
  build-mac:
    needs: [prepare_release]
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Verify runner architecture
        shell: bash
        run: |
          ACTUAL_ARCH="$(node -p 'process.arch')"
          if [ "$ACTUAL_ARCH" != "arm64" ]; then
            echo "::error::Expected an arm64 runner, but Node.js is running as $ACTUAL_ARCH"
            exit 1
          fi

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-arm64-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-pnpm-store-

      - name: Install dependencies
        env:
          PNPM_CONFIG_NODE_LINKER: hoisted
        run: pnpm install --frozen-lockfile

      # Rust native parser：目标架构与 electron-builder --arm64 保持一致
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parser-native
          key: arm64

      - name: Build native parser (arm64)
        run: pnpm --filter @openchatlab/parser-native build

      - name: Verify native parser artifact
        shell: bash
        run: ls -la packages/parser-native/chatlab-parser-native.darwin-arm64.node

      - name: Inject version into app package.json
        shell: bash
        run: |
          VERSION="${{ needs.prepare_release.outputs.version }}"
          echo "Injecting version: $VERSION"
          node -e "
            const fs = require('fs');
            for (const p of ['apps/desktop/package.json', 'apps/cli/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf-8'));
              pkg.version = '${VERSION}';
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
              console.log(p + ' → ' + '${VERSION}');
            }
          "

      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-arm64-electron-builder-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-electron-builder-

      # macOS 签名和公证需要的 API Key 文件
      - name: Create Apple API Key File
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Build Electron app for macOS (arm64)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 代码签名
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 公证
          APPLE_API_KEY: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        working-directory: apps/desktop
        run: pnpm run build && pnpm exec electron-builder --mac --arm64 --config electron-builder.yml -p never

      - name: Verify native parser in packaged app (arm64)
        shell: bash
        run: node scripts/check-desktop-native.mjs darwin-arm64

      - name: Upload macOS artifacts (arm64)
        uses: actions/upload-artifact@v6
        with:
          name: ChatLab-mac-arm64
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.yml
            apps/desktop/dist/*.json
            apps/desktop/dist/*.blockmap
          if-no-files-found: warn
          retention-days: 1 # 只保留1天，Release后会上传到GitHub Releases

  release:
    needs: [prepare_release, build-mac]
    runs-on: ubuntu-latest
    if: >-
      ${{
        !cancelled() &&
        needs.prepare_release.result == 'success' &&
        needs.build-mac.result == 'success' &&
        (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
      }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download macOS artifacts (arm64)
        uses: actions/download-artifact@v8
        with:
          name: ChatLab-mac-arm64
          path: release-dist

      - name: List files
        run: ls -la release-dist/

      - name: Generate Release Notes
        id: release_notes
        run: |
          CURRENT_VERSION="${{ needs.prepare_release.outputs.version_tag }}"
          VERSION_NUMBER="${{ needs.prepare_release.outputs.version }}"

          echo "Current version: $CURRENT_VERSION"

          # 按当前版本号从 changelog JSON 中提取 summary，避免补发旧版本时误用第一条日志。
          EN_SUMMARY=$(jq -r --arg version "$VERSION_NUMBER" 'map(select(.version == $version))[0].summary // "See changelog for details"' changelogs/en.json 2>/dev/null || echo "See changelog for details")
          CN_SUMMARY=$(jq -r --arg version "$VERSION_NUMBER" 'map(select(.version == $version))[0].summary // "详见更新日志"' changelogs/cn.json 2>/dev/null || echo "详见更新日志")

          echo "EN summary: $EN_SUMMARY"
          echo "CN summary: $CN_SUMMARY"

          # 生成 release notes
          {
            echo "## What's New"
            echo ""
            echo "$EN_SUMMARY"
            echo ""
            echo "## 更新内容"
            echo ""
            echo "$CN_SUMMARY"
            echo ""
            echo "---"
            echo ""
            echo "Full Changelog: [English](https://github.com/ChatLab/ChatLab/blob/main/changelogs/en.md) | [中文](https://github.com/ChatLab/ChatLab/blob/main/changelogs/cn.md) | [日本語](https://github.com/ChatLab/ChatLab/blob/main/changelogs/ja.md)"
            echo ""
            echo "---"
            echo ""
            echo "## Download"
            echo ""
            echo "| Platform | File |"
            echo "|-----------------|-------------|"
            echo "| Mac (Apple Silicon) | [ChatLab-${VERSION_NUMBER}-arm64.dmg](https://github.com/ChatLab/ChatLab/releases/download/v${VERSION_NUMBER}/ChatLab-${VERSION_NUMBER}-arm64.dmg) |"
          } > release_notes.md

          echo "Generated release notes:"
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.version_tag }}
          name: ChatLab ${{ needs.prepare_release.outputs.version_tag }}
          prerelease: ${{ needs.prepare_release.outputs.is_prerelease }}
          body_path: release_notes.md
          files: |
            release-dist/*.dmg
            release-dist/*.zip
            release-dist/*.yml
            release-dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
